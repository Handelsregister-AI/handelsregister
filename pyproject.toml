[build-system]
# Keep the backend compatible with the package's supported Python 3.8 runtime.
requires       = ["setuptools>=68", "wheel"]
build-backend  = "setuptools.build_meta"

[project]
name            = "handelsregister"
dynamic         = ["version"]
description     = "Python SDK für den Zugriff auf die Handelsregister AI API"
readme          = "README.md"
authors         = [
  { name = "Handelsregister Team", email = "info@handelsregister.ai" }
]

license         = { text = "AGPL-3.0-only" }

classifiers     = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
keywords        = [
  "handelsregister", "api", "german company data", "business data"
]

dependencies    = [
  "httpx>=0.23.0",
  "tqdm>=4.0.0",
  "pandas>=1.0.0",
  "openpyxl>=3.0.0",
  "rich>=13.0.0",
]
requires-python = ">=3.8"

[project.urls]
Homepage     = "https://github.com/Handelsregister-AI/handelsregister"
"Bug Reports" = "https://github.com/Handelsregister-AI/handelsregister/issues"

[tool.setuptools]
packages = ["handelsregister"]  # simple, explicit package list
# Use the legacy setuptools key while Python 3.8 remains supported. Modern
# installers accept the resulting License-File metadata, and this ensures that
# both the wheel and source distribution contain the license.
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "handelsregister.version.__version__" }

[project.scripts]
handelsregister = "handelsregister.cli:main"
