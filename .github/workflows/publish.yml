name: Publish Python Package

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example, v0.10.0)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: pypi-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    # Keep the Python 3.8 release check on a supported runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.13']

    steps:
    - uses: actions/checkout@v7
      with:
        ref: refs/tags/${{ env.RELEASE_TAG }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . pytest ruff==0.16.1

    - name: Verify release tag matches package version
      run: >-
        python -c "import os; from handelsregister import __version__;
        expected = f'v{__version__}';
        assert os.environ['RELEASE_TAG'] == expected,
        f'release tag must be {expected}'"

    - name: Lint
      run: |
        ruff check handelsregister tests examples
        ruff check --select S handelsregister examples

    - name: Run offline test suite
      run: python -m pytest -m "not live_api"

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        ref: refs/tags/${{ env.RELEASE_TAG }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pip-audit twine

    - name: Build and validate distributions
      run: |
        python -m pip_audit . --strict --progress-spinner off
        python -m build
        python -m twine check dist/*

    - name: Store distributions
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/*
        if-no-files-found: error
        retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/handelsregister
    permissions:
      id-token: write

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
